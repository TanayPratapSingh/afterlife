# registry_quality: a Lakeflow Declarative Pipeline (formerly Delta Live
# Tables) that publishes contract checked copies of silver into
# <catalog>.publication. Source and rationale: ../pipelines/registry_quality.py.
#
# Serverless on both targets. Free Edition offers nothing else, and on a paid
# workspace serverless pipelines include expectations without choosing a
# product edition (classic compute would need edition ADVANCED for them).
# Triggered, not continuous: afterlife_daily runs it after silver.
# Free Edition allows one active pipeline per pipeline type; this is the only one.

resources:
  pipelines:
    registry_quality:
      name: afterlife_registry_quality
      catalog: ${var.catalog}
      schema: publication
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: ../pipelines/registry_quality.py
      configuration:
        afterlife.catalog: ${var.catalog}
        afterlife.silver_schema: silver
      # The pipeline event log as a Unity Catalog table, so per expectation
      # metrics for every update are queryable next to expectation_results.
      event_log:
        catalog: ${var.catalog}
        schema: ops
        name: registry_quality_event_log
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure
      tags:
        project: afterlife
        component: publication
