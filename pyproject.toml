[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterlife"
version = "0.1.0"
description = "A cross source retraction registry on a lakehouse: AWS for ingest and serving, Databricks for transformation, dbt across four warehouses."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tanay Pratap Singh" }]
requires-python = ">=3.11"
# The core (afterlife/core, afterlife/sources) is standard library only, so the
# same code runs on a laptop, in AWS Lambda, and on a Databricks cluster.
dependencies = []

[project.optional-dependencies]
# Spark 3.5 matches Databricks Runtime 15.4 and 16.4 LTS. Pinned to the exact
# Spark that Delta 3.3 is built against: with PySpark 3.5.7, every
# REPLACE TABLE AS SELECT fails with "does not support truncate in batch
# mode" (reproduced outside dbt), which breaks dbt-spark table models.
# CI also runs the Spark suite on 4.0.1 with Delta 4.0.1 (DBR 17, serverless).
spark = ["pyspark==3.5.3", "delta-spark==3.3.2", "pyarrow>=15"]
# A bundled Java runtime so the Spark suite runs from pip alone, no system JDK.
local = ["jdk4py==17.0.9.2"]
dbt = ["dbt-core>=1.8,<2", "dbt-duckdb>=1.8,<2", "duckdb>=1.1"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6", "moto[s3,dynamodb]>=5", "build>=1.2"]

[project.scripts]
afterlife = "afterlife.cli:main"
# The Databricks job entry point (databricks/resources/afterlife_daily.job.yml).
afterlife_job = "afterlife_jobs.main:main"

[tool.setuptools.packages.find]
where = [".", "databricks/src"]
include = ["afterlife*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: needs pyspark and a Java runtime",
    "data: needs landed snapshots under data/ (skipped when absent)",
    "aws: needs boto3 and moto",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
